<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员页模板 · 黄石三中文娱俱乐部 HSSZEC</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap">
<style>
:root{
  --paper:#F7F6F1;--ink:#1A1D24;--navy:#12233D;--navy-deep:#0C1A2E;
  --gold:#C6952E;--gold-soft:#E4C27A;--muted:#6F7480;--line:#DCD8CC;
  --serif:"Noto Serif SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 24px;}
.back{display:inline-block;margin:28px 0;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);}
.back:hover{color:var(--navy);border-bottom-color:var(--gold);}
.card{background:#FFFEF9;border:1px solid var(--line);padding:44px 40px;margin-bottom:48px;}
.head{display:flex;align-items:center;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line);}
.avatar{
  width:84px;height:84px;flex:0 0 84px;border-radius:50%;
  background:var(--navy);color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:30px;
}
.name{font-family:var(--serif);font-weight:700;font-size:26px;}
.role{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}
.info{padding-top:26px;}
.info .row{display:flex;gap:22px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;}
.info .k{flex:0 0 96px;color:var(--muted);font-size:13px;letter-spacing:.1em;padding-top:1px;}
.info .v{color:#3A3E47;}
.bio{margin-top:22px;color:#4A4E57;font-size:15px;}
.bio .label{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.bio .label::before{content:"";width:18px;height:2px;background:var(--gold);}
.foot{border-top:1px solid var(--line);padding:22px 0 30px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="index.html">‹ 返回俱乐部首页</a>

  <!-- 成员卡片：复制本文件为 member-姓名.html，改下面高亮处即可 -->
  <div class="card">
    <div class="head">
      <div class="avatar">林</div>
      <div>
        <p class="name">林一舟</p>
        <p class="role">活动部 · 部员</p>
      </div>
    </div>
    <div class="info">
      <div class="row"><span class="k">部门</span><span class="v">活动部</span></div>
      <div class="row"><span class="k">职务</span><span class="v">部员</span></div>
      <div class="row"><span class="k">入会时间</span><span class="v">2025年9月</span></div>
      <div class="row"><span class="k">个人页</span><span class="v">member-林一舟.html</span></div>
    </div>
    <div class="bio">
      <p class="label">个人简介</p>
      <p>在这里写成员的自我介绍：爱好、特长、在俱乐部负责的事。一两段就够，像聊天一样写。</p>
    </div>
  </div>

  <div class="foot">
    <span>© 2026 黄石三中文娱俱乐部（HSSZEC）</span>
    <span>成员信息经本人授权展示</span>
  </div>
</div>

</body>
</html>
